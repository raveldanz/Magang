name: Daily Auto Streak Bot

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  # Memungkinkan trigger manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Streak Activity
        run: |
          mkdir -p .github/activity
          date -u +"Last commit: %Y-%m-%d %H:%M:%S UTC" > .github/activity/streak.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/activity/streak.txt
          git commit -m "chore(streak): daily auto commit [skip ci]" || echo "Nothing to commit"
          git push
